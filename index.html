<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mani Sachdeva | Filmmaker</title>
<meta name="description" content="Mani Sachdeva is a filmmaker and producer, a UC Santa Cruz film graduate relocating to Los Angeles. Films, credits and contact.">
<meta property="og:title" content="Mani Sachdeva | Filmmaker">
<meta property="og:description" content="Mani Sachdeva is a filmmaker and producer, a UC Santa Cruz film graduate relocating to Los Angeles. Films, credits and contact.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2327272a'/%3E%3Cpath d='M6 23V9h4.6l5.4 8.4L21.4 9H26v14h-4v-8l-4.6 7h-2.8L10 15v8z' fill='%23fafafa'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: slim charcoal bar; a full-bleed painted banner with a heavy wide title on the left and light text on the right; then two-up 16:9 stills with centred caps captions on off-white. One fixed look in every theme, by choice. */
:root {
  --char: #27272a;
  --char-2: #3a3a3f;
  --paper: #fafafa;
  --ink: #27272a;
  --on-dark: #fafafa;
  --rule: #d8d8dc;
  --muted: #5d5d64;
  --field: #ffffff;
  --amber: #e39a1e;
  --shade: rgba(39, 39, 42, .34);
  --veil: rgba(24, 24, 27, .6);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --text: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --gutter: clamp(16px, 4vw, 80px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}

.display {
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: .005em;
  line-height: .96;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
.heavy {
  font-family: var(--text);
  font-weight: 700;
  letter-spacing: 0;
}

/* hand-drawn stroke under a word */
.ul { position: relative; display: inline-block; max-width: 100%; }
.ul svg {
  position: absolute; left: -3%; bottom: -.24em;
  width: 106%; height: .2em;
  fill: currentColor; pointer-events: none;
}

/* ---------- preview note + top bar ---------- */
.preview-note {
  background: var(--char-2); color: var(--on-dark);
  font-size: .78rem; padding: 8px var(--gutter);
}
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--char); color: var(--on-dark);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 2px 24px; padding: 11px var(--gutter);
  font-size: .8rem; text-transform: uppercase; font-weight: 500;
}
.nav a { text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; }
.nav .brand { letter-spacing: .09em; }
.nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 2px 22px; margin: 0; padding: 0; }
.nav li a { letter-spacing: .04em; }
.nav li a:hover, .nav li a[aria-current="page"] { border-bottom-color: var(--on-dark); }

/* ---------- home hero ---------- */
.hero { position: relative; overflow: hidden; background: var(--char); color: var(--on-dark); }
.hero-bg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 3px; }
.hero-bg.n1 { grid-template-columns: minmax(0, 1fr); }
.hero-bg span { background: var(--char-2) center 30% / cover no-repeat; filter: saturate(.8); }
.hero-bg::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(24, 24, 27, .84) 0%, rgba(24, 24, 27, .56) 52%, rgba(24, 24, 27, .74) 100%);
}
.hero-in { position: relative; }
.hero-in {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px;
  min-height: clamp(420px, 52vw, 700px);
  padding: clamp(40px, 6vw, 96px) var(--gutter) clamp(48px, 7vw, 110px);
}
.mega { font-size: clamp(4rem, 12vw, 11.5rem); line-height: .92; }
.mega span { display: block; }
.roles { font-size: clamp(.95rem, 1.7vw, 1.6rem); text-transform: uppercase; margin: 1em 0 0; }
.hero-pitch { align-self: end; justify-self: end; text-align: right; display: grid; gap: 20px; justify-items: end; }
.pitch-big { font-size: clamp(1.7rem, 3.7vw, 3.5rem); line-height: 1.05; margin: 0 0 .25em; }
.pitch-small { font-size: clamp(1rem, 1.7vw, 1.6rem); margin: 0; }

.btn {
  display: inline-block; border: 1px solid currentColor; background: transparent; color: inherit;
  padding: 1.15em 3.2em; font: inherit; font-size: .9rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: .03em; text-decoration: none; cursor: pointer;
}
.hero .btn:hover { background: var(--on-dark); color: var(--char); }
.btn.dark { background: var(--char); color: var(--on-dark); border-color: var(--char); }
.btn.dark:hover { background: transparent; color: var(--char); }
.btn.small { padding: .7em 1.4em; font-size: .78rem; }

/* ---------- page banner ---------- */
.banner { position: relative; overflow: hidden; background: var(--char); color: var(--on-dark); }
.banner-bg { position: absolute; inset: 0; background: center 30% / cover no-repeat; }
.banner-bg::after { content: ""; position: absolute; inset: 0; background: var(--veil); }
.banner.soft .banner-bg { inset: -40px; filter: blur(22px) saturate(1.15); }
.banner-in { position: relative; }
.banner-in {
  display: grid; grid-template-columns: fit-content(56%) minmax(0, 1fr); align-items: center;
  gap: clamp(24px, 5vw, 90px);
  padding: clamp(48px, 7vw, 104px) var(--gutter);
}
.banner h1 { font-size: clamp(2.8rem, 7.4vw, 7rem); }
.banner h1.long { font-size: clamp(2rem, 4.4vw, 4rem); }
.lede {
  font-weight: 300; letter-spacing: 0;
  font-size: clamp(1.05rem, 1.75vw, 1.7rem); line-height: 1.32;
  margin: 0; max-width: 34em;
}

/* ---------- sections ---------- */
.wrap { padding: clamp(36px, 5vw, 72px) var(--gutter); }
.band { display: grid; gap: clamp(20px, 2.6vw, 36px); justify-items: center; text-align: center; }
.band h2 { font-size: clamp(2.6rem, 7vw, 6rem); }
.band .lede { max-width: 46em; }
.band .player, .band .still { width: min(100%, 1100px); }

.grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(28px, 3.4vw, 56px) clamp(20px, 2.2vw, 44px);
}
.tile { display: grid; gap: 14px; text-decoration: none; align-content: start; }
.tile.wide { grid-column: 1 / -1; }
.frame {
  position: relative; display: block; aspect-ratio: 16 / 9; max-width: 100%;
  background: var(--char) center / cover no-repeat; color: var(--on-dark); overflow: hidden;
}
.tile.wide .frame { aspect-ratio: 21 / 9; }
.grid.r43 .tile:not(.wide) .frame { aspect-ratio: 4 / 3; }
.tile.wide .frame img { object-position: center 30%; }
.frame img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity .3s;
}
.frame.has-img img { opacity: 1; }
.grid.r43 .tile:not(.wide) .frame img.fit { object-fit: contain; background: #000; }
.frame.has-img .card-title, .frame.has-img .tag { display: none; }
.card-title {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: 9%; font-size: clamp(1.4rem, 3.4vw, 3rem);
}
.tile.wide .card-title { font-size: clamp(1.8rem, 5.4vw, 5rem); }
.tag {
  position: absolute; left: 14px; top: 12px;
  font-size: .7rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
}
.tile:hover .frame, .player:hover { filter: brightness(1.08); }
a.cap { text-decoration: none; }
a.cap:hover { text-decoration: underline; }
.cap {
  font-family: var(--display); font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; text-align: center;
  font-size: clamp(1.05rem, 1.5vw, 1.4rem); line-height: 1.2;
}

/* ---------- video ---------- */
.player, .still {
  position: relative; display: block; aspect-ratio: 16 / 9; max-width: 100%; margin-inline: auto;
  background: var(--char) center / cover no-repeat; color: var(--on-dark);
  text-decoration: none; overflow: hidden;
}
.player .play, .still .play {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px;
  background: var(--shade);
  font-size: .82rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
}
.play-btn {
  width: clamp(56px, 8vw, 88px); aspect-ratio: 1; border: 2px solid currentColor; border-radius: 50%;
  display: grid; place-items: center;
}
.play-btn::after {
  content: ""; margin-left: 12%;
  border-left: clamp(14px, 2.1vw, 22px) solid currentColor;
  border-top: clamp(9px, 1.35vw, 14px) solid transparent;
  border-bottom: clamp(9px, 1.35vw, 14px) solid transparent;
}
.player iframe, .player img, .still img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }

/* ---------- film page ---------- */
.narrow { max-width: 1100px; margin-inline: auto; }
.detail {
  display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: clamp(28px, 5vw, 80px); margin-top: clamp(32px, 4vw, 56px);
}
.label { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 .7em; }
.prose p {
  font-weight: 400; font-size: 1.15rem; line-height: 1.6;
  margin: 0 0 1em; max-width: 65ch;
}
.meta { display: grid; gap: 20px; align-content: start; margin: 0; }
.meta dd { margin: 0; font-weight: 400; }
.pager {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px;
  margin-top: clamp(36px, 5vw, 64px); padding-top: 22px; border-top: 2px solid var(--ink);
  font-size: .9rem; text-transform: uppercase;
}
.pager a { text-decoration: none; }
.pager a:hover { text-decoration: underline; }

/* ---------- credits ---------- */
.credits { display: grid; gap: clamp(36px, 5vw, 64px); }
.credits h2 { font-size: clamp(1.7rem, 3.2vw, 2.8rem); margin-bottom: .5em; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.rows li {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 8.5em;
  gap: 4px 24px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: baseline;
}
.rows .t { font-weight: 600; }
.rows .r { font-weight: 400; }
.rows .y { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

/* ---------- about + contact ---------- */
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(28px, 4vw, 64px); align-items: start; }
.portrait { display: block; width: 100%; height: auto; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(20px, 2.2vw, 44px); margin-top: clamp(36px, 5vw, 64px); }
.gallery img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 70%; }
.about.nophoto { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
.photo {
  aspect-ratio: 4 / 5; max-width: 100%; background: var(--rule) center / cover no-repeat;
  display: grid; place-items: center; text-align: center; padding: 16px;
  color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
}
.about .prose p { font-size: clamp(1.1rem, 1.5vw, 1.35rem); }

.contact { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(32px, 6vw, 96px); align-items: start; }
.contact > * { min-width: 0; }
.reach { display: grid; gap: 28px; }
.reach-photo { display: block; width: 100%; height: auto; margin-top: 8px; }
.email { font-size: clamp(1.1rem, 2.2vw, 1.9rem); overflow-wrap: anywhere; margin: 0 0 12px; }
.reach a.big { font-size: clamp(1.1rem, 2.2vw, 1.9rem); text-decoration: none; }
.reach a.big:hover { text-decoration: underline; }
form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field label { font-size: .78rem; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
input, textarea {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--ink); border-radius: 0; padding: 12px 14px; width: 100%;
}
textarea { min-height: 150px; resize: vertical; }
.status { font-size: .9rem; color: var(--muted); margin: 0; min-height: 1.4em; }

/* ---------- footer ---------- */
.foot {
  border-top: 1px solid var(--rule); padding: 24px var(--gutter) 40px;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
}
.foot a { text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.foot span + span { display: flex; flex-wrap: wrap; gap: 8px 22px; }

/* ---------- small screens ---------- */
@media (max-width: 820px) {
  .banner-in { grid-template-columns: minmax(0, 1fr); }
  .detail, .about, .contact { grid-template-columns: minmax(0, 1fr); }
  .about .photo { max-width: 280px; }
}
@media (max-width: 720px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .hero-bg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-pitch { justify-self: start; text-align: left; justify-items: start; }
}
@media (max-width: 640px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .tile.wide .frame { aspect-ratio: 16 / 9; }
  .grid.r43 .tile.wide .frame { aspect-ratio: 4 / 3; }
  .tile.wide .frame img { object-position: center; }
  .rows li { grid-template-columns: minmax(0, 1fr) auto; }
  .rows .t { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .frame img { transition: none; }
}
</style>
</head>
<body>
<!-- You do not need to edit this file. Your words, films and links live in content.js -->
<div class="preview-note" id="preview-note" hidden>Preview. Video players switch on once the site is online, so here each film links out to YouTube.</div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<main id="app"></main>
<footer class="foot" id="foot"></footer>
<noscript><p style="padding:24px">This site needs JavaScript switched on to show the films.</p></noscript>
<script src="content.js"></script>
<script>
/* Site engine. You should not need to edit this: all your words live in content.js */
(function () {
  "use strict";

  var S = window.SITE || {};
  var PREVIEW = !!window.PREVIEW;
  var app = document.getElementById("app");
  var navEl = document.getElementById("nav");
  var footEl = document.getElementById("foot");
  var films = (S.films || []).filter(function (f) { return f && f.title; });
  var PAGES = ["directing", "projects", "about", "contact"];

  var BRUSH = '<svg viewBox="0 0 504 12" preserveAspectRatio="none" aria-hidden="true"><path d="M3 4.4C130 3.8 374 3.8 501 4.4c2.4.7 2.4 2.5 0 3.2C374 8.2 130 8.2 3 7.6c-2.6-.7-2.6-2.5 0-3.2z"/></svg>';

  /* ---------- small helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function slug(t) {
    return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function ytId(u) {
    var m = String(u || "").match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  function filmBySlug(s) {
    for (var i = 0; i < films.length; i++) if (slug(films[i].title) === s) return i;
    return -1;
  }

  /* ---------- picture backgrounds ---------- */
  function bgUrl(src) {
    return src ? " style=\"background-image:url('" + esc(src) + "')\"" : "";
  }

  /* ---------- building blocks ---------- */
  function stillImg(f, poster) {
    var own = poster ? (f.poster || f.image) : f.image;
    if (own) return '<img src="' + esc(own) + '" alt="" data-still>';
    var id = ytId(f.youtube);
    if (id && !PREVIEW) {
      return '<img class="fit" src="https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg" data-fallback="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="" loading="lazy" data-still>';
    }
    return "";
  }
  function banner(title, intro, image, long, soft, focus) {
    return '<header class="banner' + (soft ? " soft" : "") + '">' +
      (image ? '<span class="banner-bg" style="background-image:url(\'' + esc(image) + "')" + (focus ? ";background-position:" + esc(focus) : "") + '"></span>' : "") +
      '<div class="banner-in"><h1 class="display' + (long ? " long" : "") + '"><span class="ul">' + esc(title) + BRUSH + "</span></h1>" +
      (intro ? '<p class="lede">' + esc(intro) + "</p>" : "") + "</div></header>";
  }
  function tile(f, i, wide) {
    var s = slug(f.title);
    return '<a class="tile' + (wide ? " wide" : "") + '" href="#film-' + s + '" data-route="film-' + s + '">' +
      '<span class="frame">' +
      '<span class="tag">' + esc(f.status || f.year || "") + "</span>" +
      '<span class="card-title display">' + esc(f.title) + "</span>" + stillImg(f) + "</span>" +
      '<span class="cap">' + esc(f.title) + "</span></a>";
  }
  function player(f, i) {
    var id = ytId(f.youtube);
    var bg = "";
    if (!id) {
      return '<div class="still"' + bg + ">" + ((f.poster || f.image) ? '<img src="' + esc(f.poster || f.image) + '" alt="">' : "") +
        (f.status ? '<span class="play">' + esc(f.status) + "</span>" : "") + "</div>";
    }
    return '<a class="player" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener" data-yt="' + id + '"' + bg + ">" +
      stillImg(f, true) +
      '<span class="play"><span class="play-btn"></span><span>' + (PREVIEW ? "Watch on YouTube" : "Play film") + "</span></span></a>";
  }

  /* ---------- pages ---------- */
  function home() {
    var hero = S.hero || {};
    var fi = filmBySlug(slug(S.featured || ""));
    if (fi < 0) fi = films.length > 1 && !ytId(films[0].youtube) ? 1 : 0;
    var f = films[fi];
    var name = String(S.name || "").split(/\s+/).map(function (w) { return "<span>" + esc(w) + "</span>"; }).join(" ");
    var shots = (hero.images && hero.images.length ? hero.images : (hero.image ? [hero.image] : [])).filter(Boolean);
    var html = '<header class="hero"><div class="hero-bg n' + shots.length + '" aria-hidden="true">' +
      shots.map(function (s) { return "<span" + bgUrl(s) + "></span>"; }).join("") + '</div><div class="hero-in">' +
      '<div><h1 class="display mega">' + name + "</h1>" +
      '<p class="roles heavy">' + (S.roles || []).map(esc).join(" | ") + "</p></div>" +
      '<div class="hero-pitch"><div>' +
      (hero.big ? '<p class="pitch-big heavy"><span class="ul">' + esc(hero.big) + BRUSH + "</span></p>" : "") +
      (hero.small ? '<p class="pitch-small heavy">' + esc(hero.small) + "</p>" : "") + "</div>" +
      '<a class="btn" href="#directing" data-route="directing">' + esc(hero.button || "View films") + "</a></div>" +
      "</div></header>";
    if (f) {
      var s = slug(f.title);
      html += '<section class="wrap band"><h2 class="display">Latest film</h2>' +
        (f.logline ? '<p class="lede">' + esc(f.logline) + "</p>" : "") +
        player(f, fi) +
        '<a class="cap" href="#film-' + s + '" data-route="film-' + s + '">' + esc(f.title) + (f.year ? " (" + esc(f.year) + ")" : "") + "</a></section>";
    }
    return html;
  }

  function directing() {
    var p = (S.pages || {}).directing || {};
    var odd = films.length % 2 === 1;
    return banner(p.title || "Directing", p.intro, p.image, false, false, p.focus) +
      '<section class="wrap"><div class="grid' + (S.thumbShape === "4:3" ? " r43" : "") + '">' +
      films.map(function (f, i) { return tile(f, i, odd && i === 0); }).join("") +
      "</div></section>";
  }

  function film(i) {
    var f = films[i];
    var prev = films[i - 1], next = films[i + 1];
    var meta = "";
    function row(label, value) {
      if (value) meta += '<div><dt class="label heavy">' + label + "</dt><dd>" + value + "</dd></div>";
    }
    row("Year", esc(f.year));
    row("Type", esc(f.kind));
    row("Status", esc(f.status));
    row("Cast", (f.cast || []).map(esc).join("<br>"));
    row("Festivals", (f.festivals || []).map(esc).join("<br>"));
    row("Awards", esc(f.awards));
    var id = ytId(f.youtube);
    if (id) row("Watch", '<a href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener">YouTube</a>');
    return banner(f.title, f.logline, f.poster || f.image || (ytId(f.youtube) && !PREVIEW ? "https://i.ytimg.com/vi/" + ytId(f.youtube) + "/hqdefault.jpg" : ""), f.title.length > 16, true) +
      '<section class="wrap"><div class="narrow">' + player(f, i) +
      '<div class="detail"><div class="prose">' +
      (f.statement ? '<h2 class="label heavy">' + esc(f.statementLabel || "Director's statement") + "</h2><p>" + esc(f.statement) + "</p>" : "") +
      '</div><dl class="meta">' + meta + "</dl></div>" +
      '<nav class="pager heavy" aria-label="More films">' +
      (prev ? '<a href="#film-' + slug(prev.title) + '" data-route="film-' + slug(prev.title) + '">&larr; ' + esc(prev.title) + "</a>" : "<span></span>") +
      '<a href="#directing" data-route="directing">All films</a>' +
      (next ? '<a href="#film-' + slug(next.title) + '" data-route="film-' + slug(next.title) + '">' + esc(next.title) + " &rarr;</a>" : "<span></span>") +
      "</nav></div></section>";
  }

  function projects() {
    var p = (S.pages || {}).projects || {};
    return banner(p.title || "Projects", p.intro, p.image, false, false, p.focus) +
      '<section class="wrap"><div class="narrow credits">' +
      (S.credits || []).map(function (g) {
        return '<div><h2 class="display">' + esc(g.group) + '</h2><ul class="rows">' +
          (g.items || []).map(function (it) {
            return '<li><span class="t">' + esc(it[0]) + '</span><span class="r">' + esc(it[1]) + '</span><span class="y">' + esc(it[2]) + "</span></li>";
          }).join("") + "</ul></div>";
      }).join("") + "</div></section>";
  }

  function about() {
    var p = (S.pages || {}).about || {}, a = S.about || {};
    var photo = a.photo
      ? '<img class="portrait" src="' + esc(a.photo) + '" alt="' + esc(S.name) + '">'
      : (PREVIEW ? '<div class="photo">Your photo goes here</div>' : "");
    var gallery = (a.gallery || []).filter(Boolean).map(function (src) {
      return '<img src="' + esc(src) + '" alt="' + esc(S.name) + ' at work" loading="lazy">';
    }).join("");
    return banner(p.title || "About", p.intro, p.image, false, false, p.focus) +
      '<section class="wrap"><div class="narrow"><div class="about' + (photo ? "" : " nophoto") + '">' + photo +
      '<div class="prose">' + (a.paragraphs || []).map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") +
      '<p><a class="btn dark" href="#directing" data-route="directing">See the films</a></p></div></div>' +
      (gallery ? '<div class="gallery">' + gallery + "</div>" : "") + "</div></section>";
  }

  function contact() {
    var p = (S.pages || {}).contact || {};
    return banner(p.title || "Contact", p.intro, p.image, false, false, p.focus) +
      '<section class="wrap"><div class="narrow contact"><div class="reach">' +
      (S.email ? '<div><h2 class="label heavy">Email</h2><p class="email heavy" id="email-text">' + esc(S.email) + '</p><button class="btn dark small" type="button" id="copy-email">Copy address</button></div>' : "") +
      (S.phone ? '<div><h2 class="label heavy">Phone</h2>' + (PREVIEW
        ? '<p class="email heavy">' + esc(S.phone) + "</p>"
        : '<a class="big heavy" href="tel:' + esc(String(S.phone).replace(/[^0-9+]/g, "")) + '">' + esc(S.phone) + "</a>") + "</div>" : "") +
      (S.instagram ? '<div><h2 class="label heavy">Instagram</h2><a class="big heavy" href="https://www.instagram.com/' + esc(S.instagram) + '/" target="_blank" rel="noopener">@' + esc(S.instagram) + "</a></div>" : "") +
      (p.photo ? '<img class="reach-photo" src="' + esc(p.photo) + '" alt="' + esc(S.name) + ' at work" loading="lazy">' : "") +
      '</div><form id="contact-form" novalidate>' +
      '<div class="field"><label for="cf-name">Name</label><input id="cf-name" name="name" autocomplete="name" required></div>' +
      '<div class="field"><label for="cf-email">Email address</label><input id="cf-email" name="email" type="email" autocomplete="email" required></div>' +
      '<div class="field"><label for="cf-message">Message</label><textarea id="cf-message" name="message" required></textarea></div>' +
      '<div><button class="btn dark" type="submit">Send email</button></div>' +
      '<p class="status" id="cf-status" role="status"></p></form></div></section>';
  }

  /* ---------- routing ---------- */
  function currentRoute() {
    return String(location.hash || "").replace(/^#/, "");
  }
  function render(route) {
    var html, active = "", title = "";
    if (route.indexOf("film-") === 0) {
      var i = filmBySlug(route.slice(5));
      if (i >= 0) { html = film(i); active = "directing"; title = films[i].title; }
    } else if (route === "directing") { html = directing(); active = route; title = "Directing"; }
    else if (route === "projects") { html = projects(); active = route; title = "Projects"; }
    else if (route === "about") { html = about(); active = route; title = "About"; }
    else if (route === "contact") { html = contact(); active = route; title = "Contact"; }
    if (!html) html = home();
    app.innerHTML = html;
    var links = navEl.querySelectorAll("li a");
    for (var k = 0; k < links.length; k++) {
      if (links[k].getAttribute("data-route") === active) links[k].setAttribute("aria-current", "page");
      else links[k].removeAttribute("aria-current");
    }
    if (!PREVIEW) document.title = (title ? title + " | " : "") + (S.name || "");
    wireStills();
  }
  function go(route) {
    try { history.pushState(null, "", "#" + route); } catch (e) { try { location.hash = route; } catch (e2) {} }
    render(route);
    window.scrollTo(0, 0);
  }

  /* show a real still once it has loaded; keep the painted title card if it has not */
  function wireStills() {
    var imgs = app.querySelectorAll("img[data-still]");
    Array.prototype.forEach.call(imgs, function (img) {
      function ok() {
        if (img.naturalWidth > 200) {
          /* a widescreen picture in a 4:3 tile is shown whole instead of having its sides cut off */
          if (img.naturalWidth / img.naturalHeight > 1.6) img.classList.add("fit");
          img.parentNode.classList.add("has-img"); return;
        }
        var fb = img.getAttribute("data-fallback");
        if (fb) { img.removeAttribute("data-fallback"); img.src = fb; }
      }
      function bad() {
        var fb = img.getAttribute("data-fallback");
        if (fb) { img.removeAttribute("data-fallback"); img.src = fb; } else { img.remove(); }
      }
      img.addEventListener("load", ok);
      img.addEventListener("error", bad);
      if (img.complete) { if (img.naturalWidth) ok(); else if (img.src) bad(); }
    });
  }

  /* ---------- clicks and the form ---------- */
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[data-route]") : null;
    if (a) {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      go(a.getAttribute("data-route"));
      return;
    }
    var pl = e.target.closest ? e.target.closest("a.player[data-yt]") : null;
    if (pl && !PREVIEW) {
      e.preventDefault();
      var frame = document.createElement("div");
      frame.className = "player";
      frame.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + pl.getAttribute("data-yt") +
        '?autoplay=1&rel=0" title="Film player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      pl.parentNode.replaceChild(frame, pl);
      return;
    }
    if (e.target.id === "copy-email") {
      var btn = e.target, text = S.email || "";
      var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy address"; }, 1800); };
      var select = function () {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("email-text"));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        btn.textContent = "Selected. Press copy";
      };
      try { navigator.clipboard.writeText(text).then(done, select); } catch (err) { select(); }
    }
  });

  document.addEventListener("submit", function (e) {
    if (e.target.id !== "contact-form") return;
    e.preventDefault();
    var f = e.target, status = document.getElementById("cf-status");
    var name = f.elements.name.value.trim(), email = f.elements.email.value.trim(), msg = f.elements.message.value.trim();
    if (!name || !email || !msg) { status.textContent = "Fill in your name, email address and a message first."; return; }
    if (PREVIEW) {
      status.textContent = "The form is switched off in this preview. On the live site it opens the visitor's email app with their message filled in.";
      return;
    }
    location.href = "mailto:" + S.email + "?subject=" + encodeURIComponent("Portfolio message from " + name) +
      "&body=" + encodeURIComponent(msg + "\n\nFrom: " + name + " (" + email + ")");
    status.textContent = "Your email app should open with the message filled in. If nothing opens, write to " + S.email + ".";
  });

  /* ---------- start ---------- */
  navEl.innerHTML = '<a class="brand" href="#home" data-route="home">' + esc(S.name || "") + "</a><ul>" +
    PAGES.map(function (p) {
      var t = ((S.pages || {})[p] || {}).title || p;
      return '<li><a href="#' + p + '" data-route="' + p + '">' + esc(t) + "</a></li>";
    }).join("") + "</ul>";

  footEl.innerHTML = "<span>&copy; " + new Date().getFullYear() + " " + esc(S.name || "") +
    (S.studio ? " &middot; " + esc(S.studio) : "") + "</span><span>" +
    (S.instagram ? '<a href="https://www.instagram.com/' + esc(S.instagram) + '/" target="_blank" rel="noopener">Instagram</a>' : "") +
    '<a href="#contact" data-route="contact">Contact</a></span>';

  if (PREVIEW) {
    var note = document.getElementById("preview-note");
    if (note) note.hidden = false;
  }

  window.addEventListener("hashchange", function () { render(currentRoute()); });
  window.addEventListener("popstate", function () { render(currentRoute()); });
  render(currentRoute());
})();
</script>
</body>
</html>
